# 人工占位主色（种子档案用，非实测值）
#
# 用途：用户还没手动填满图片前，让清单里的品牌都有可匹配的主色档案，
#       使「人像衣服颜色 -> 品牌」链路能完整跑通。
# 语义：这些值是凭常见包装配色的粗略估计，origin='reference'、confidence 低；
#       一旦用户在 data/images/<key>_<中文名>/ 放入图片并执行 scan，
#       该品牌档案自动升级为图片实测色（origin='images'），占位值不再生效。
# 维护：不要求精确，用户可用自己认可的色值直接改这里，或干脆放图覆盖。
