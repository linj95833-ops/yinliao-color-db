# 逐品牌包装贴图微调表 —— 55 个品牌逐个调过，缺省字段回落到 config.py 的 WRAP_* 默认值
#
# crop        [x1,y1,x2,y2] 归一化，先把源图裁到产品 / 标签主视觉（白底小瓶图的关键）
# word_y     主视觉在衣服上的竖直落点，与「窗口取景」解耦；避开 V 领凹口
# crisp      0~1 低分辨率包装字的颜色归位重锐化（配合 crisp_sharp / crisp_sigma）
# curve_order  胸廓形变插值阶数，3 = 三次插值，字更不易糊（默认 1）
# 不提供任何程序绘制/打印品牌字的参数：衣服上只出现包装图自带的艺术字与图案。
# 源图主字被领口吞掉或太糊时，用 focus / word_y / zoom / crisp 调整取景与锐化，
# 或换一张更清晰的正面包装图，不再用印刷体补字。
# keep_body_white  1 = 白色罐体/透明瓶身的「瓶体白」保留原样，只补掉瓶外摄影棚白底；
#                  用彩色像素外接框区分瓶内白与瓶外白，并跳过 tint 染色与两侧反光裁切。
# focus       [y1,y2] 或 [x1,y1,x2,y2]，标签内「主字 / 主图案」所在的窗口（白底瓶的关键）
# tint_mix    染色目标里品牌主色的占比（默认 0.55，越大颜色越浓）
# rotate      90° 旋转次数 0~3（横版包装需要时）
# tint        0~1，把「亮且低饱和」的白瓶 / 白底染成品牌浅色调，深色文字与图案保留
# tint_hex    覆盖染色用的颜色（默认取该品牌实测主色）
# bg_mix      0~1，把与边框连通的白底补成品牌主色（产品占比很小时用）
# bright / contrast / boost   亮度 / 对比 / 饱和度补偿，1 = 不变
# zoom        >1 放大标签窗口，让主字更大；<1 缩小
# trim_top / trim_bottom      额外裁掉标签上下端的比例（默认 0.10 / 0.06，聚焦后一般调小）
# anchor / text_pos           包装主字在标签内 / 在衣服上的竖直位置
# side_pad / fill_w / fill_h / lower_mix / sharp / curve / arc   其它几何微调
#
# 康师傅冰红茶是效果基准：留空 {}，任何默认值变动都不会让它退化。
